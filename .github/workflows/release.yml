# release.yml — Publish on version tag
#
# Triggered by pushing a semver tag (e.g. `git tag v1.2.3 && git push --tags`).
# Pre-releases are detected automatically from the tag name: any tag containing
# a hyphen (v1.0.0-rc.1, v2.0.0-beta.1) is marked as pre-release on GitHub.
#
# Pipeline (jobs run in parallel after tests pass):
#
#   test-ts        → TypeScript build + vitest + coverage
#   publish-npm    → @usekamori/sdk, @usekamori/mcp, @usekamori/ingest, kamori (CLI)
#   publish-docker → multi-arch Docker image pushed to ghcr.io
#   github-release → GitHub Release created with auto-generated changelog
#
# SDK releases handled by their own repos:
#   Python → usekamori/kamori-python (publishes to PyPI)
#   PHP    → usekamori/kamori-php    (Packagist via webhook)
#   Go     → usekamori/kamori-go     (pkg.go.dev auto-indexed)
#
# npm — Trusted Publishers. One-time setup per package on npmjs.com:
#         Package → Settings → Trusted Publishers → Add publisher
#         → org: usekamori, repo: kamori, workflow: release.yml, environment: npm

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub Release
  packages: write   # push Docker image to GHCR
  id-token: write   # OIDC for npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release mid-flight

jobs:
  # =============================================================================
  # 1. TypeScript — build & test
  # =============================================================================
  test-ts:
    name: TypeScript — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: TypeScript tests + coverage
        run: npx vitest run --coverage

  # =============================================================================
  # =============================================================================
  # 2. NPM PUBLISH — OIDC Trusted Publishers (no NPM_TOKEN secret needed)
  # =============================================================================
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test-ts]
    environment: npm   # must match the environment configured in the Trusted Publisher
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Publish @usekamori/sdk
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          npm view @usekamori/sdk@$VERSION version 2>/dev/null && echo "already published, skipping" || npm publish --workspace=packages/sdk --access public --provenance

      - name: Publish @usekamori/mcp
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          npm view @usekamori/mcp@$VERSION version 2>/dev/null && echo "already published, skipping" || npm publish --workspace=packages/mcp --access public --provenance

      - name: Publish @usekamori/ingest
        run: |
          VERSION=$(node -p "require('./packages/ingest/package.json').version")
          npm view @usekamori/ingest@$VERSION version 2>/dev/null && echo "already published, skipping" || npm publish --workspace=packages/ingest --access public --provenance

      - name: Publish kamori (CLI scaffolder)
        run: |
          VERSION=$(node -p "require('./packages/npx-kamori/package.json').version")
          npm view kamori@$VERSION version 2>/dev/null && echo "already published, skipping" || npm publish --workspace=packages/npx-kamori --access public --provenance

      - name: Show npm debug log
        if: failure()
        run: cat /home/runner/.npm/_logs/*.log

  # =============================================================================
  # 3. DOCKER PUBLISH
  #    Builds a multi-arch image (amd64 + arm64) and pushes to GHCR.
  #    Tags produced from v1.2.3: 1.2.3, 1.2, 1, latest
  # =============================================================================
  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [test-ts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/usekamori/kamori
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # 4. GITHUB RELEASE + CHANGELOG
  # =============================================================================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-docker]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for accurate release notes

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install

            ```bash
            # Node.js SDK
            npm install @usekamori/sdk

            # Self-hosted ingest server
            npx @usekamori/ingest

            # npx scaffolder
            npx kamori my-logs --yes

            # Python SDK
            pip install kamori-sdk

            # PHP SDK
            composer require usekamori/kamori-php

            # Go SDK
            go get github.com/usekamori/kamori-go

            # Docker
            docker pull ghcr.io/usekamori/kamori:${{ github.ref_name }}
            ```
